[package]
name = "panopus"
version = "1.15.2"
description = "macOS font manager"
authors = ["Loris Briguet"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "panopus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
# 0.32 is the newest rusqlite whose libsqlite3-sys (0.30) still unifies with
# tauri-plugin-sql's sqlx-sqlite; 0.33+ needs libsqlite3-sys >0.30 and the
# `links = "sqlite3"` constraint forbids two copies in one binary.
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-notification = "2"
ttf-parser = "0.24"
# Ledger checksums for the setup() schema bootstrap — must stay on the same
# major as the sha2 used by sqlx's migrator (SHA-384 over the migration SQL).
sha2 = "0.10"
core-foundation = "0.10"
md5 = "0.7"
walkdir = "2"
notify = "6"
